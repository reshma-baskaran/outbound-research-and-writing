<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Outbound Research and Writing</title>
  <desc id="desc">Editorial portfolio cover showing evidence mapped into six distinct outbound touches.</desc>
  <rect width="1600" height="900" fill="#f2efe7"/>
  <path d="M0 96H1600M0 814H1600M96 0V900M1504 0V900" stroke="#181816" stroke-opacity=".2"/>
  <text x="96" y="62" font-family="Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="-2" fill="#181816">RB<tspan fill="#ff6b4a">.</tspan></text>
  <text x="1257" y="60" font-family="Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2.2" fill="#181816">SKILL + WRITING SYSTEM</text>
  <circle cx="1229" cy="54" r="6" fill="#ff6b4a"/>

  <text x="96" y="194" font-family="Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="3" fill="#181816">02 / SELECTED SYSTEM</text>
  <text x="88" y="326" font-family="Helvetica Neue,Arial,sans-serif" font-size="112" font-weight="700" letter-spacing="-8" fill="#181816">Outbound</text>
  <text x="94" y="432" font-family="Georgia,Times New Roman,serif" font-size="116" font-style="italic" fill="#2f5cff">research</text>
  <text x="96" y="533" font-family="Helvetica Neue,Arial,sans-serif" font-size="105" font-weight="700" letter-spacing="-7" fill="#181816">&amp; writing.</text>
  <text x="98" y="604" font-family="Helvetica Neue,Arial,sans-serif" font-size="25" fill="#181816">Research once. Give every touch a different job.</text>

  <g transform="translate(905 182)">
    <text x="0" y="0" font-family="Helvetica Neue,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2.2" fill="#181816">SOURCE-BACKED SEQUENCE</text>
    <path d="M60 70H550" stroke="#181816" stroke-width="2"/>
    <circle cx="60" cy="70" r="16" fill="#d8ff56" stroke="#181816" stroke-width="2"/>
    <circle cx="256" cy="70" r="9" fill="#ff6b4a"/>
    <circle cx="550" cy="70" r="16" fill="#2f5cff" stroke="#181816" stroke-width="2"/>

    <g font-family="Helvetica Neue,Arial,sans-serif" fill="#181816">
      <rect x="0" y="125" width="270" height="112" fill="#e8e1d4" stroke="#181816" stroke-width="2"/>
      <text x="24" y="161" font-size="14" font-weight="900" letter-spacing="2">01 / PRESSURE</text>
      <path d="M24 185H224M24 205H179" stroke="#181816" stroke-opacity=".45" stroke-width="4"/>

      <rect x="300" y="125" width="270" height="112" fill="#f2efe7" stroke="#181816" stroke-width="2"/>
      <text x="324" y="161" font-size="14" font-weight="900" letter-spacing="2">02 / BUYER SEAT</text>
      <path d="M324 185H529M324 205H472" stroke="#181816" stroke-opacity=".45" stroke-width="4"/>

      <rect x="0" y="267" width="270" height="112" fill="#f2efe7" stroke="#181816" stroke-width="2"/>
      <text x="24" y="303" font-size="14" font-weight="900" letter-spacing="2">03 / TEST</text>
      <path d="M24 327H224M24 347H191" stroke="#181816" stroke-opacity=".45" stroke-width="4"/>

      <rect x="300" y="267" width="270" height="112" fill="#e8e1d4" stroke="#181816" stroke-width="2"/>
      <text x="324" y="303" font-size="14" font-weight="900" letter-spacing="2">04 / NEW ANGLE</text>
      <path d="M324 327H529M324 347H454" stroke="#181816" stroke-opacity=".45" stroke-width="4"/>

      <rect x="0" y="409" width="270" height="112" fill="#e8e1d4" stroke="#181816" stroke-width="2"/>
      <text x="24" y="445" font-size="14" font-weight="900" letter-spacing="2">05 / WORKFLOW</text>
      <path d="M24 469H224M24 489H164" stroke="#181816" stroke-opacity=".45" stroke-width="4"/>

      <rect x="300" y="409" width="270" height="112" fill="#f2efe7" stroke="#181816" stroke-width="2"/>
      <text x="324" y="445" font-size="14" font-weight="900" letter-spacing="2">06 / CLOSE</text>
      <path d="M324 469H529M324 489H486" stroke="#181816" stroke-opacity=".45" stroke-width="4"/>
    </g>
  </g>

  <text x="98" y="858" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#181816">RESEARCH MAP · SIX-TOUCH SEQUENCE · PRE-SEND QA</text>
  <text x="1438" y="858" text-anchor="end" font-family="Helvetica Neue,Arial,sans-serif" font-size="16" font-weight="800" letter-spacing="2" fill="#181816">RESHMA BASKARAN ↗</text>
</svg>
